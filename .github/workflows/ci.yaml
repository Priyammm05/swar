name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/swar_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: ../../scripts/verify_flutter_boundaries.sh
      - run: ../../scripts/verify_user_testing_framework.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libasound2-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos-build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/swar_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install cmake
      - run: flutter pub get
      - run: flutter test integration_test/core_bridge_test.dart -d macos
      - run: ../../scripts/run_synthetic_user_test.sh macos
      - run: flutter build macos --release
      - run: ../../scripts/verify_macos_bundle.sh build/macos/Build/Products/Release/swar.app
      - uses: actions/upload-artifact@v4
        with:
          name: swar-macos-universal-release
          path: apps/swar_desktop/build/macos/Build/Products/Release/swar.app
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: swar-macos-synthetic-user-evidence
          path: apps/swar_desktop/build/user-testing/synthetic-user/
          if-no-files-found: error

  windows-build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/swar_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - name: Confirm native build tools
        run: cmake --version && clang --version
      - run: flutter pub get
      - run: flutter test integration_test/core_bridge_test.dart -d windows
      - run: ../../scripts/run_synthetic_user_test.sh windows
        shell: bash
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: swar-windows-x64-release
          path: apps/swar_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: swar-windows-synthetic-user-evidence
          path: apps/swar_desktop/build/user-testing/synthetic-user/
          if-no-files-found: error
