<svg width="1254" height="1254" viewBox="0 0 1254 1254" fill="none"
xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(627 560) rotate(90) scale(760)">
      <stop offset="0" stop-color="#6B8F80"/>
      <stop offset="0.42" stop-color="#537C6A"/>
      <stop offset="0.76" stop-color="#3F6858"/>
      <stop offset="1" stop-color="#2F5547"/>
    </radialGradient>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="1254" height="1254" fill="url(#bg)"/>
  <rect width="1254" height="1254" filter="url(#grain)" opacity="0.55"/>

  <g transform="translate(267 494)">
    <rect x="0" y="0" width="720" height="266" rx="133"
      stroke="#080A09" stroke-width="16"/>
    <rect x="129" y="90" width="30" height="86" rx="15" fill="#080A09"/>
    <rect x="201" y="118" width="30" height="108" rx="15" fill="#080A09"/>
    <rect x="273" y="104" width="30" height="136" rx="15" fill="#080A09"/>
    <rect x="345" y="64" width="30" height="154" rx="15" fill="#080A09"/>
    <rect x="417" y="28" width="30" height="160" rx="15" fill="#080A09"/>
    <rect x="489" y="42" width="30" height="126" rx="15" fill="#080A09"/>
    <rect x="561" y="74" width="30" height="100" rx="15" fill="#080A09"/>
  </g>
</svg>
