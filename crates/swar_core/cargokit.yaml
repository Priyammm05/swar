cargo:
  debug:
    toolchain: '1.88.0'
  release:
    toolchain: '1.88.0'
  # NOTE: this framework deliberately links NO llama.cpp. Offline cleanup runs in
  # the separate `swar_llm_server` binary (crates/swar_llm_server) and is reached
  # over a pipe via src/llm_client.rs. That keeps whisper.cpp's ggml the only ggml
  # linked here, avoiding the duplicate-symbol collision that blocked linking both
  # libraries into one static framework.
